<section class="section" aria-labelledby="cta-title" style="padding-bottom:0">
  <div class="container">
    <div class="cta-band" data-reveal>
      <div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
      <div class="grain" aria-hidden="true"></div>
      <span class="chip">{{icon:clock}} Free 30-minute call · no obligation</span>
      <h2 id="cta-title">Ready to make your brand <span class="grad-text">shine</span>?</h2>
      <p class="lead">Book a call at a time that suits you, or send a two-line enquiry. Based in Indore, working with brands across India and worldwide.</p>
      <div class="row" style="justify-content:center">
        <a class="btn btn-primary btn-lg magnetic" href="/book" data-contact="call">{{icon:calendar}} Book a call</a>
        <a class="btn btn-ghost btn-lg" href="/book#enquiry" data-contact="enquiry">{{icon:message}} Send an enquiry</a>
      </div>
    </div>
  </div>
</section>
