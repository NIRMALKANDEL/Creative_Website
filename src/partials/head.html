<!doctype html>
<html lang="en-IN" data-theme="{{fallbackTheme}}"{{htmlAttrs}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{siteUrl}}{{path}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#140B0F" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FBF6EF" media="(prefers-color-scheme: light)">
<meta name="color-scheme" content="dark light">
<script>{{themeScript}}</script>
<link rel="preload" href="/assets/fonts/syne-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>{{css}}{{lookCss}}</style>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{siteName}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{siteUrl}}{{path}}">
<meta property="og:image" content="{{siteUrl}}{{ogImage}}">
<meta property="og:image:alt" content="{{ogImageAlt}}">
<meta property="og:locale" content="en_IN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{siteUrl}}{{ogImage}}">
<meta name="twitter:image:alt" content="{{ogImageAlt}}">
{{headExtra}}
<script type="application/ld+json">{{jsonld}}</script>
<script src="/assets/js/{{jsFile}}" defer></script>
</head>
<body>
